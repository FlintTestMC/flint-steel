[package]
name = "flint-steel"
version = "1.2.0"
edition = "2024"
description = "Flint testing framework integration for SteelMC"

[profile.flint]
inherits = "dev"
debug = true

[profile.cicd]
inherits = "release"

[dependencies]
# Internal crates
steel-core = { git = "https://github.com/kdcokenny/SteelMC.git", rev = "36a8e5b40f49eada0a6040c443bbebdce1366eba", features = ["test-harness"] }
steel-registry = { git = "https://github.com/kdcokenny/SteelMC.git", rev = "36a8e5b40f49eada0a6040c443bbebdce1366eba" }
steel-utils = { git = "https://github.com/kdcokenny/SteelMC.git", rev = "36a8e5b40f49eada0a6040c443bbebdce1366eba" }

glam = "0.33"
simdnbt = "0.10"
# UUID
uuid = { version = "1.20", features = ["serde", "v4"] }

# Flint testing framework
flint-core = { git = "https://github.com/kdcokenny/flint-core.git", rev = "7fdac26b820199bed941e1cb0120d06e1ce81952" }

# Hash maps
rustc-hash = "2.1.1"

anyhow = "1.0.104"
serde_json = "1"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
single_call_fn = "allow"
multiple_inherent_impl = "allow"
shadow_unrelated = "allow"
missing_errors_doc = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
cargo_common_metadata = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
absolute_paths = "warn"
missing_const_for_fn = "warn"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
unwrap_used = { level = "warn", priority = -3 }
